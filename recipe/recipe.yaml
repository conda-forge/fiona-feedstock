schema_version: 1

context:
  name: fiona
  version: "1.10.1"

package:
  name: fiona
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/fiona-${{ version }}.tar.gz
  sha256: b00ae357669460c6491caba29c2022ff0acfcbde86a95361ea8ff5cd14a86b68
  patches:
    - 0001-remove-certifi-dependency.patch
    - 0002-remove-dup-where.patch
    - 0003-pyparsing-one-of-dep.patch
    # GDAL >=3.13 dropped pfnDelete from the GeoJSON driver, so the legacy
    # OGR_Dr_TestCapability(ODrCDeleteDataSource) check fiona guards on now
    # reports False even though GDALDeleteDataset still deletes the dataset.
    - 0004-relax-dataset-delete-capability-check.patch
    # GDAL >=3.13 writes compact GeoJSON; two tests assert on the old padding.
    - 0005-geojson-writer-no-longer-pads-with-spaces.patch

build:
  number: 8
  python:
    entry_points:
      - fio = fiona.fio.main:main_group

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - cython >=3.0.2,<3.1.dev0
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
  host:
    - python
    - pip
    - cython >=3.0.2,<3.1.dev0
    - setuptools >=67.8
    - libgdal-core
  run:
    - python
    # purposefully excluding certifi as dependency
    # see: https://github.com/conda-forge/fiona-feedstock/pull/220#issuecomment-1830275315
    - attrs >=19.2.0
    - click >=8.0,<9.dev0
    - cligj >=0.5
    - click-plugins >=1.0
    # only include calc extra by default
    - pyparsing
    - shapely

tests:
  - python:
      imports:
        - fiona
        - fiona.fio
      pip_check: true
  - files:
      recipe:
        - test_data
    script:
      - fio --help
      - fio ls test_data/test.shp
      - fio info test_data/test.shp
  - files:
      recipe:
        - test_data
        - run_test.py
      source:
        - tests
    requirements:
      run:
        - aiohttp
        - pytest >=3
        - boto3 >=1.2.4
        - fsspec
        - packaging
        - pytz
    script:
      file: run_test

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Fiona reads and writes spatial data files
  homepage: http://github.com/Toblerity/Fiona

extra:
  recipe-maintainers:
    - zklaus
    - akrherz
    - ocefpaf
    - jorisvandenbossche
    - xylar
